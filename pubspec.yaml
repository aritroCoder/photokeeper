name: photokeeper
description: "Cross-platform UI for the PhotoKeeper keep/delete classifier."
publish_to: 'none'
version: 0.0.2+2

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  photokeeper_core:
    path: core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
