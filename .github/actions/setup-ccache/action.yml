name: Cache native compilation
description: Reuse C/C++ compiler outputs across Linux and Android CI builds
runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        if ! command -v ccache >/dev/null; then
          sudo apt-get update && sudo apt-get install -y ccache
        fi
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
    - name: Configure compiler caching
      shell: bash
      run: |
        # ccache checks compiler contents, flags and source/header contents itself.
        # CMake reads these launchers when configuring both Flutter and Gradle's Ninja builds.
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=2G"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"
        CCACHE_DIR="$RUNNER_TEMP/ccache" ccache --zero-stats
