# Builds every platform on its own native runner (Flutter cannot cross-compile desktop apps).
# Every push and PR uploads the builds as workflow artifacts. A push to main also publishes whatever
# finished as the "latest" GitHub Release; a v* tag publishes a versioned release instead.
# The C++ core is cloned by core/src/CMakeLists.txt (FetchContent), so no second checkout here.
# Only the APK is signed (with the ANDROID_KEYSTORE_B64 secret, so updates install over it); the rest are
# unsigned: fine for sideloading, stores and Gatekeeper need signing secrets added later.
# The desktop jobs also check that the in-app updater can install the latest published release (lib/update.dart).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - &flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build libgtk-3-dev xvfb ccache
      - uses: ./.github/actions/setup-ccache
      - run: flutter analyze
      - run: flutter test test/update_test.dart
      - run: flutter build linux --release
      - name: Native compiler cache statistics
        run: ccache --show-stats
      - run: tar -C build/linux/x64/release -czf photokeeper-linux-x64.tar.gz bundle
      # This build's updater (as version 0.0.0) must replace itself with the latest published release and relaunch.
      - name: Self-update test
        timeout-minutes: 10
        run: |
          flutter build linux --release -t tool/update_selftest.dart --build-name=0.0.0
          app="$RUNNER_TEMP/bundle"
          cp -r build/linux/x64/release/bundle "$app"
          Xvfb :99 & export DISPLAY=:99 && sleep 2
          "$app/photokeeper"
          cat "$app/data/flutter_assets/version.json"
          ! grep -q '"version": *"0.0.0"' "$app/data/flutter_assets/version.json" || { echo "::error::not replaced"; exit 1; }
          sleep 10 && pgrep -af "$app/photokeeper" || { echo "::error::not relaunched"; exit 1; }
          pkill -f "$app/photokeeper"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: photokeeper-linux-x64.tar.gz }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - *flutter
      - run: flutter build windows --release
      - name: Bundle the VC++ runtime so machines without the redistributable can start the exe
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($file in "photokeeper.exe", "photokeeper_core.dll", "flutter_windows.dll") {
            if (!(Test-Path "$out\$file" -PathType Leaf)) { throw "Missing Windows bundle file: $out\$file" }
          }
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") { Copy-Item "C:\Windows\System32\$dll" $out }
      - name: Build the Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\photokeeper.iss'
      - name: Test installation, upgrade, and uninstall
        shell: pwsh
        run: >-
          ./windows/installer/test-installer.ps1
          -InstallerPath photokeeper-windows-x64-setup.exe
          -BundleDir build/windows/x64/runner/Release
      - name: Self-update test (see linux)
        timeout-minutes: 10
        shell: pwsh
        run: |
          flutter build windows --release -t tool/update_selftest.dart --build-name=0.0.0
          if ($LASTEXITCODE) { throw "Self-update build failed" }  # else the real app from the step above runs
          $p = Start-Process build\windows\x64\runner\Release\photokeeper.exe -PassThru
          $p.WaitForExit()  # not Start-Process -Wait, which also waits for the setup it spawns
          if ($p.ExitCode -ne 0) { throw "Updater exited with $($p.ExitCode)" }
          Wait-Process -Name photokeeper-windows-x64-setup -Timeout 300 -ErrorAction SilentlyContinue
          $exe = "$env:LOCALAPPDATA\Programs\PhotoKeeper\photokeeper.exe"
          if (!(Test-Path $exe)) { throw "The latest release's installer did not install $exe" }
          (Get-Item $exe).VersionInfo | Format-List ProductVersion
          Get-Process photokeeper -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: photokeeper-windows-x64-setup.exe, if-no-files-found: error }

  android:
    runs-on: ubuntu-24.04
    env: { ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          # PR caches are scoped to their merge ref; allow a rerun to measure warm builds.
          cache-read-only: false
      - *flutter
      - uses: ./.github/actions/setup-ccache
      - name: Release signing key (an APK signed with any other key can't update installed copies)
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing; refusing to publish a debug-signed APK"; exit 1
          fi
      - name: CMake version pinned in core/android/build.gradle (the core needs >= 3.24)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" > /dev/null
      - run: flutter build apk --release
      - name: Native compiler cache statistics
        run: ccache --show-stats
      - run: cp build/app/outputs/flutter-apk/app-release.apk photokeeper-android-arm64.apk
      - name: Signed with the release key, not a debug key
        if: env.ANDROID_KEYSTORE != ''
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs photokeeper-android-arm64.apk | tee /dev/stderr | grep -q 'CN=PhotoKeeper'
      - uses: actions/upload-artifact@v4
        with: { name: android, path: photokeeper-android-arm64.apk }

  apple:  # one job so the xcframework (three OpenCV builds) is compiled once for both
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - *flutter
      - name: Identify the Apple toolchain
        id: toolchain
        run: |
          {
            xcodebuild -version
            xcrun clang --version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphonesimulator --show-sdk-version
            xcrun --sdk macosx --show-sdk-version
            cmake --version
            sw_vers -productVersion
          } > "$RUNNER_TEMP/apple-toolchain.txt"
          fingerprint=$(shasum -a 256 "$RUNNER_TEMP/apple-toolchain.txt" | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the native Apple frameworks
        id: apple-core
        uses: actions/cache@v4
        with:
          path: |
            core/ios/Frameworks
            core/macos/Frameworks
          # Exact matches only: these are finished binaries, not compiler cache entries.
          key: apple-core-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('core/src/**', 'core/apple/build.sh') }}
      - name: Build the native Apple frameworks
        if: steps.apple-core.outputs.cache-hit != 'true'
        run: sh core/apple/build.sh
      - run: flutter build macos --release
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/photokeeper.app photokeeper-macos-arm64.zip
      - name: Self-update test (see linux)
        timeout-minutes: 10
        run: |
          flutter build macos --release -t tool/update_selftest.dart --build-name=0.0.0
          app="$RUNNER_TEMP/apps/photokeeper.app"
          mkdir -p "$RUNNER_TEMP/apps" && ditto build/macos/Build/Products/Release/photokeeper.app "$app"
          "$app/Contents/MacOS/photokeeper"
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          echo "installed $v"
          [ "$v" != 0.0.0 ] || { echo "::error::not replaced"; exit 1; }
          sleep 10 && pgrep -lf "$app/Contents/MacOS/photokeeper" || { echo "::error::not relaunched"; exit 1; }
          pkill -f "$app/Contents/MacOS/photokeeper"
      - run: flutter build ios --release --no-codesign
      - name: Unsigned .ipa (sideload with AltStore/Sideloadly, or re-sign)
        run: mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qr photokeeper-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            photokeeper-macos-arm64.zip
            photokeeper-ios-unsigned.ipa

  release:
    # runs even when some platforms failed, so the ones that built still get published
    if: >-
      !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.linux.result == 'success' || needs.windows.result == 'success' ||
       needs.android.result == 'success' || needs.apple.result == 'success')
    needs: [linux, windows, android, apple]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: pubspec.yaml, sparse-checkout-cone-mode: false }
      - name: The in-app updater compares the release tag with the app's pubspec version, so they must match
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME but pubspec.yaml says $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publish a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"; title="$tag"; flags=""; else
            tag=latest; title="Latest build"; flags=--prerelease
            gh release delete latest --yes --cleanup-tag || true   # replace the previous build
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" || true   # else create reuses the old commit
          fi
          gh release create "$tag" photokeeper-* --title "$title" --target "${{ github.sha }}" $flags \
            --notes "Built from ${{ github.sha }}. Unsigned: sideload only."
